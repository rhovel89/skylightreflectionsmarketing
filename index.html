<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Intelligence CRM — Private Demo</title>
<style>
:root{--bg:#080b12;--panel:#0f1420;--panel2:#131a28;--line:#253047;--text:#eef3ff;--muted:#91a0ba;--cyan:#4dd8ff;--blue:#6b78ff;--green:#42e59a;--amber:#ffbc57;--red:#ff6577;--shadow:0 18px 50px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16213a 0,transparent 28%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:20px 14px;background:rgba(8,11,18,.92);position:sticky;top:0;height:100vh}.brand{padding:10px 10px 22px}.brand b{font-size:19px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.nav button{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#172034;color:#fff}.conn{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.conn h4{margin:0 0 8px;font-size:10px;letter-spacing:.15em;color:var(--muted)}.prov{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}.prov b{color:var(--amber)}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:10px;color:var(--cyan);font-weight:800;letter-spacing:.16em}.top h1{margin:6px 0 5px;font-size:28px}.top p{margin:0;color:var(--muted)}.pill{padding:7px 10px;border:1px solid #5c4827;background:#21190e;border-radius:999px;color:var(--amber);font-weight:700}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.searchbox{display:grid;grid-template-columns:1.5fr 1fr 1.5fr .55fr 1fr 1fr .6fr auto;gap:10px;padding:14px}.field span{display:block;color:var(--muted);font-size:10px;margin:0 0 5px}.field input,.field select,.filters input,.filters select,.drawer input,.drawer select,.drawer textarea{width:100%;background:#0a0f19;color:#fff;border:1px solid #2b3750;border-radius:9px;padding:9px 10px;outline:none}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#1a2438;color:#fff;border:1px solid #31415f}.btn.primary{background:linear-gradient(90deg,#3b78ff,#6d5cff);border:0}.btn.danger{background:#32141a;border-color:#6e2532;color:#ff9baa}.btn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.stat{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0d131f}.stat span{color:var(--muted);font-size:11px}.stat b{display:block;font-size:23px;margin-top:5px}.head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{margin:3px 0 0}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}.filters input{max-width:250px}.filters select{width:auto}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th{font-size:10px;color:var(--muted);text-align:left;padding:11px;border-bottom:1px solid var(--line);letter-spacing:.08em}.table td{padding:12px 11px;border-bottom:1px solid #1b2434;vertical-align:top}.table tr:hover{background:#111a29}.biz b{font-size:14px}.sub{color:var(--muted);font-size:11px;margin-top:4px}.score{font-weight:900;font-size:18px}.hot{color:var(--red)}.cold{color:var(--green)}.tag{display:inline-block;padding:4px 7px;border:1px solid #33425f;border-radius:999px;font-size:10px;margin:2px 3px 2px 0;color:#cbd7ed}.tag.good{border-color:#256847;color:#75f3b3}.tag.bad{border-color:#6d2b35;color:#ff8f9f}.empty{padding:50px;text-align:center;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(8,minmax(220px,1fr));gap:10px;overflow:auto;padding-bottom:8px}.col{background:#0b1019;border:1px solid var(--line);border-radius:12px;min-height:280px}.colh{padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.card{margin:8px;padding:10px;background:#131b2a;border:1px solid #26334d;border-radius:10px;cursor:pointer}.card:hover{border-color:#485f8a}.drawerback{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:20;display:flex;justify-content:flex-end}.drawer{width:min(620px,96vw);height:100%;overflow:auto;background:#0b1019;border-left:1px solid var(--line);padding:20px}.drawer h2{margin:4px 0}.section{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#101725}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{display:grid;grid-template-columns:160px 1fr;gap:6px;padding:4px 0}.kv span:first-child{color:var(--muted)}.break{word-break:break-word}.historyrow{display:grid;grid-template-columns:170px 1.2fr 1.4fr .8fr 90px;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.notice{padding:10px 12px;border:1px solid #385072;border-radius:10px;background:#10192a;margin-bottom:12px}.mobile{display:none}@media(max-width:1100px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:14px}.searchbox{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.mobile{display:block}.top h1{font-size:22px}}@media(max-width:650px){.searchbox{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column}.grid2{grid-template-columns:1fr}.historyrow{grid-template-columns:1fr}.drawer{width:100%}}
</style></head><body><div id="app"></div>
<script>
const STAGES=['New','Researched','Contacted','Follow-Up','Appointment','Proposal','Won','Lost'];
const LS={leads:'li_demo_leads_v4',history:'li_demo_history_v4',activity:'li_demo_activity_v4'};
let state={view:'search',results:[],saved:JSON.parse(localStorage.getItem(LS.leads)||'[]'),history:JSON.parse(localStorage.getItem(LS.history)||'[]'),activity:JSON.parse(localStorage.getItem(LS.activity)||'[]'),selected:null,filters:{q:'',temp:'ALL',web:'ALL',maps:'ALL',contact:'ALL',gbp:'ALL'},form:{niche:'Roofing contractors',businessName:'',cities:'Pontiac, Bloomington',state:'IL',area:'',keyword:'',limit:20}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const domain=u=>{try{return new URL(/^https?:\/\//i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'').toLowerCase()}catch{return''}};
const keys=l=>[l.placeId&&'p:'+l.placeId,l.website&&'d:'+domain(l.website),l.phone&&'t:'+l.phone.replace(/\D/g,''),l.name&&l.address&&'n:'+norm(l.name)+':'+norm(l.address)].filter(Boolean);
const same=(a,b)=>{const A=new Set(keys(a));return keys(b).some(x=>A.has(x))};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=seed||123456;return()=>((x=Math.imul(x^x>>>15,1|x),x^=x+Math.imul(x^x>>>7,61|x),((x^x>>>14)>>>0))/4294967296)}
function score(l){let s=0,b=[];const add=(n,w)=>{s+=w;b.push([n,w])};if(!l.website)add('No website',24);else{if(l.webScore<55)add('Poor website',16);else if(l.webScore<72)add('Weak website',9);if(l.webAgeMonths>30)add('Stale website',8);if(!l.analytics)add('Missing analytics',4);if(!l.metaPixel)add('Missing Meta Pixel',4);if(!l.adsTracking)add('Missing Google Ads tracking',4);if(!l.schema)add('Missing schema',4);if(!l.ctaStrong)add('Weak calls to action',5)}if(l.socialMissing>=3)add('Missing social networks',5);if(l.socialInactive)add('Inactive social accounts',4);if(l.gbpClaimed===false)add('Unclaimed GBP',8);if(l.mapRank==null)add('Not ranked on Maps',8);else if(l.mapRank>3)add('Outside top-3 Map Pack',6);if(l.reviews<20)add('Low review count',5);if(l.rating<4)add('Weak review rating',5);if(l.decisionMaker)add('Decision maker identified',4);if(l.email)add('Professional email available',3);if(l.phone)add('Phone available',2);s=Math.min(100,s);return{score:s,temp:s>=60?'HOT':'COLD',breakdown:b}}
const names=['Summit','Heritage','Prime','Evergreen','Ironclad','Northstar','Precision','Lakeview','Cornerstone','Apex','Legacy','Blue Sky'];
const suffix=['Solutions','Services','Pros','Group','Company','Experts','Works'];
function makeLead(niche,city,stateName,area,keyword,i){const seed=hash([niche,city,stateName,area,keyword,i].join('|')),r=rng(seed),ar=i%7;let noWeb=ar===0, weak=ar===1||ar===4,strong=ar===2;let name=names[Math.floor(r()*names.length)]+' '+(niche.split(' ')[0]||'Local')+' '+suffix[Math.floor(r()*suffix.length)];let web=noWeb?'':`https://${norm(name)}.com`;let l={id:'r_'+seed,placeId:'demo_'+seed,name,address:`${100+Math.floor(r()*900)} ${['Main','Oak','Washington','Market','Lincoln'][Math.floor(r()*5)]} St, ${city}, ${stateName}`,city,state:stateName,area,niche,keyword,phone:r()>.12?`(${200+Math.floor(r()*700)}) ${200+Math.floor(r()*700)}-${1000+Math.floor(r()*9000)}`:'',website:web,email:r()>.4?`owner@${domain(web)||norm(name)+'.com'}`:'',decisionMaker:r()>.35?['Alex Morgan','Jamie Carter','Taylor Brooks','Chris Bennett'][Math.floor(r()*4)]:'',title:'Owner',rating:ar===3?3.6:Number((3.8+r()*1.2).toFixed(1)),reviews:ar===5?8:Math.floor(r()*180),gbpClaimed:ar===4?false:r()>.15,mapRank:ar===6?null:1+Math.floor(r()*14),webScore:noWeb?0:strong?88:weak?48:68,webAgeMonths:strong?6:weak?40:18,analytics:strong||r()>.5,metaPixel:strong||r()>.65,adsTracking:strong||r()>.7,schema:strong||r()>.55,ctaStrong:strong||r()>.45,socialMissing:strong?1:Math.floor(r()*5),socialInactive:!strong&&r()>.5,lastSocial:strong?'3 days ago':r()>.5?'9 months ago':'Unknown',lastGbp:r()>.5?'12 days ago':'7 months ago',stage:'',notes:'',followUp:'',deepScanned:false,createdAt:new Date().toISOString(),discovery:{niche,city,state:stateName,area,keyword}};Object.assign(l,score(l));return l}
function generate(){const f=state.form,cities=f.cities.split(',').map(x=>x.trim()).filter(Boolean);let arr=[];let count=Math.max(5,Math.min(60,+f.limit||20));for(let i=0;i<count;i++){const c=cities[i%cities.length]||'Pontiac';let l=makeLead(f.niche||'Local business',c,f.state||'IL',f.area,f.keyword||f.niche,i);if(f.businessName)l.name=f.businessName+(i?' '+(i+1):'');arr.push(l)}state.results=dedupe(arr);state.history.unshift({id:'h_'+Date.now(),date:new Date().toISOString(),...f,cities,resultCount:state.results.length});state.history=state.history.slice(0,100);persist();log(null,'search',`Scanned ${cities.join(', ')} for ${f.niche}`);render();toast(`Found ${state.results.length} prospects in demo mode.`)}
function dedupe(a){let out=[];for(const l of a){if(!out.some(x=>same(x,l)))out.push(l)}return out}
function findSaved(l){return state.saved.find(x=>same(x,l))}
function mergeLead(old,n){const m={...old,...n,stage:old.stage||n.stage||'New',notes:old.notes||n.notes||'',followUp:old.followUp||n.followUp||'',deepScanned:old.deepScanned||n.deepScanned,decisionMaker:n.decisionMaker||old.decisionMaker,email:n.email||old.email,website:n.website||old.website};Object.assign(m,score(m));return m}
function saveLead(l){let hit=findSaved(l);if(hit){state.saved=state.saved.map(x=>same(x,l)?mergeLead(x,l):x);toast('Existing lead updated without losing enrichment.')}else{let n={...l,stage:'New',savedAt:new Date().toISOString()};state.saved.unshift(n);log(n,'saved','Lead saved to CRM');toast('Lead saved to CRM.')}persist();render()}
function removeLead(l){if(!confirm('Remove '+l.name+' from CRM?'))return;state.saved=state.saved.filter(x=>!same(x,l));log(l,'removed','Lead removed from CRM');state.selected=null;persist();render()}
function deepScan(l){let s=findSaved(l)||l;let seed=hash(s.name+'deep'),r=rng(seed);let n={...s,deepScanned:true,decisionMaker:s.decisionMaker||['Morgan Reed','Jordan Ellis','Casey Parker'][Math.floor(r()*3)],email:s.email||`hello@${domain(s.website)||norm(s.name)+'.com'}`,lastSocial:r()>.4?'5 days ago':'4 months ago',lastGbp:r()>.3?'8 days ago':'5 months ago'};if(n.website){n.webScore=Math.max(n.webScore,Math.round(35+r()*50));n.analytics=r()>.45;n.metaPixel=r()>.6;n.adsTracking=r()>.7;n.schema=r()>.5;n.ctaStrong=r()>.45}Object.assign(n,score(n));if(findSaved(s))state.saved=state.saved.map(x=>same(x,s)?mergeLead(x,n):x);state.results=state.results.map(x=>same(x,s)?mergeLead(x,n):x);state.selected=n;log(n,'deep_scan','Demo Deep Scan completed');persist();render();toast('Deep Scan completed in demo mode.')}
function bulkSave(){visible().forEach(saveLead);toast('Filtered leads saved.')}
function bulkScan(){visible().slice(0,10).forEach(l=>deepScan(l));toast('Deep Scan completed for top 10 visible leads.')}
function log(l,type,text){state.activity.unshift({id:'a_'+Date.now()+Math.random(),lead:l?l.name:'',leadId:l?l.id:'',type,text,date:new Date().toISOString()});state.activity=state.activity.slice(0,500);persist()}
function persist(){localStorage.setItem(LS.leads,JSON.stringify(state.saved));localStorage.setItem(LS.history,JSON.stringify(state.history));localStorage.setItem(LS.activity,JSON.stringify(state.activity))}
function webClass(l){if(!l.website)return'NO';if(l.webScore<60)return'WEAK';if(l.webScore>=80)return'STRONG';return'MID'}function mapsClass(l){if(l.mapRank==null)return'NOTRANKED';return l.mapRank<=3?'TOP3':'OUTSIDE3'}
function visible(){let a=state.view==='pipeline'?state.saved:state.results;let f=state.filters,q=f.q.toLowerCase();return a.filter(l=>{if(q&&!JSON.stringify(l).toLowerCase().includes(q))return false;if(f.temp!=='ALL'&&l.temp!==f.temp)return false;if(f.web!=='ALL'&&webClass(l)!==f.web)return false;if(f.maps!=='ALL'&&mapsClass(l)!==f.maps)return false;if(f.contact==='DM'&&!l.decisionMaker)return false;if(f.contact==='EMAIL'&&!l.email)return false;if(f.contact==='PHONE'&&!l.phone)return false;if(f.gbp==='CLAIMED'&&l.gbpClaimed!==true)return false;if(f.gbp==='UNCLAIMED'&&l.gbpClaimed!==false)return false;return true})}
function csv(){let rows=[['Business','Address','Phone','Website','Email','Decision Maker','Title','Rating','Reviews','GBP Claimed','Map Rank','Score','Temperature','Stage','Follow Up','Notes'],...state.saved.map(l=>[l.name,l.address,l.phone,l.website,l.email,l.decisionMaker,l.title,l.rating,l.reviews,l.gbpClaimed,l.mapRank??'',l.score,l.temp,l.stage,l.followUp,l.notes])];const safe=v=>{let s=String(v??'');if(/^[\t\r\n ]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let blob=new Blob([rows.map(r=>r.map(safe).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lead-intelligence-crm.csv';a.click();URL.revokeObjectURL(a.href)}
function setStage(l,stage){state.saved=state.saved.map(x=>same(x,l)?{...x,stage}:x);log(l,'stage',`Stage changed to ${stage}`);persist();render()}
function saveDrawer(){let l=state.selected,s=findSaved(l);if(!s){saveLead(l);s=findSaved(l)}let notes=document.getElementById('notes').value,follow=document.getElementById('follow').value,stage=document.getElementById('stage').value;state.saved=state.saved.map(x=>same(x,s)?{...x,notes,followUp:follow,stage}:x);state.selected={...l,notes,followUp:follow,stage};log(l,'crm_update','Notes/follow-up/stage updated');persist();render();toast('CRM details saved.')}
function openLead(id){state.selected=[...state.results,...state.saved].find(x=>x.id===id)||null;render()}
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;right:18px;bottom:18px;z-index:99;background:#17233a;border:1px solid #415679;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 14px 35px #0008';document.body.appendChild(e)}e.textContent=t;clearTimeout(e._t);e._t=setTimeout(()=>e.remove(),2600)}
function filterHtml(){return `<div class="filters"><input placeholder="Filter business, contact, city…" value="${esc(state.filters.q)}" oninput="state.filters.q=this.value;render()"><select onchange="state.filters.temp=this.value;render()"><option value="ALL">HOT + COLD</option><option ${state.filters.temp==='HOT'?'selected':''}>HOT</option><option ${state.filters.temp==='COLD'?'selected':''}>COLD</option></select><select onchange="state.filters.web=this.value;render()"><option value="ALL">Any website</option><option value="NO">No website</option><option value="WEAK">Weak website</option><option value="STRONG">Strong website</option></select><select onchange="state.filters.maps=this.value;render()"><option value="ALL">Any Maps rank</option><option value="TOP3">Map Pack top 3</option><option value="OUTSIDE3">Outside top 3</option><option value="NOTRANKED">Not ranked</option></select><select onchange="state.filters.contact=this.value;render()"><option value="ALL">Any contact</option><option value="DM">Decision maker found</option><option value="EMAIL">Email found</option><option value="PHONE">Phone found</option></select><select onchange="state.filters.gbp=this.value;render()"><option value="ALL">Any GBP</option><option value="CLAIMED">Claimed GBP</option><option value="UNCLAIMED">Unclaimed GBP</option></select></div>`}
function table(a){if(!a.length)return`<div class="empty">No leads match the current view.</div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>BUSINESS</th><th>CONTACT</th><th>WEBSITE</th><th>GOOGLE</th><th>DECISION MAKER</th><th>OPPORTUNITY</th><th>ACTIONS</th></tr></thead><tbody>${a.map(l=>{let s=findSaved(l);return`<tr><td class="biz"><b>${esc(l.name)}</b><div class="sub">${esc(l.address)}</div><span class="tag">${esc(l.niche)}</span></td><td>${esc(l.phone||'No phone')}<div class="sub">${esc(l.email||'No email')}</div></td><td>${l.website?`<a href="${esc(l.website)}" target="_blank" style="color:var(--cyan)">${esc(domain(l.website))}</a>`:'<span class="tag bad">No website</span>'}<div class="sub">Audit: ${l.webScore}/100</div></td><td>★ ${l.rating} · ${l.reviews} reviews<div class="sub">Maps: ${l.mapRank==null?'Not ranked':'#'+l.mapRank} · GBP ${l.gbpClaimed?'Claimed':'Unclaimed'}</div></td><td>${esc(l.decisionMaker||'Not found')}<div class="sub">${esc(l.decisionMaker?l.title:'')}</div></td><td><span class="score ${l.temp==='HOT'?'hot':'cold'}">${l.score}</span><div class="sub">${l.temp}</div></td><td><button class="btn" onclick="openLead('${l.id}')">Details</button> ${s?'<span class="tag good">Saved</span>':`<button class="btn primary" onclick="saveLead(state.results.find(x=>x.id==='${l.id}'))">Save</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function drawer(){let l=state.selected;if(!l)return'';let s=findSaved(l)||l;let acts=state.activity.filter(a=>a.lead===l.name).slice(0,12);return`<div class="drawerback" onclick="if(event.target===this){state.selected=null;render()}"><div class="drawer"><button class="btn" style="float:right" onclick="state.selected=null;render()">Close</button><div class="eyebrow">LEAD INTELLIGENCE</div><h2>${esc(l.name)}</h2><div class="sub">${esc(l.address)}</div><div style="margin:12px 0"><span class="score ${l.temp==='HOT'?'hot':'cold'}">${l.score}/100 ${l.temp}</span></div>
<div class="section"><b>Contact & Decision Maker</b><div class="kv"><span>Phone</span><span>${esc(l.phone||'Not found')}</span><span>Email</span><span>${esc(l.email||'Not found')}</span><span>Decision maker</span><span>${esc(l.decisionMaker||'Not found')} ${esc(l.decisionMaker?l.title:'')}</span></div></div>
<div class="section"><b>Google / Maps</b><div class="kv"><span>Rating</span><span>${l.rating} (${l.reviews} reviews)</span><span>GBP</span><span>${l.gbpClaimed?'Appears claimed':'Appears unclaimed'}</span><span>Maps rank</span><span>${l.mapRank==null?'Not ranked':'#'+l.mapRank}${l.mapRank&&l.mapRank<=3?' · Top-3 Map Pack':''}</span><span>Last GBP activity</span><span>${esc(l.lastGbp)}</span></div></div>
<div class="section"><b>Website Marketing Audit</b><div class="kv"><span>Website</span><span class="break">${esc(l.website||'No website')}</span><span>Audit score</span><span>${l.webScore}/100</span><span>Freshness</span><span>${l.webAgeMonths} months estimated</span><span>Analytics</span><span>${l.analytics?'Detected':'Missing'}</span><span>Meta Pixel</span><span>${l.metaPixel?'Detected':'Missing'}</span><span>Google Ads tracking</span><span>${l.adsTracking?'Detected':'Missing'}</span><span>Schema</span><span>${l.schema?'Detected':'Missing'}</span><span>CTA</span><span>${l.ctaStrong?'Strong':'Weak'}</span><span>Last social activity</span><span>${esc(l.lastSocial)}</span></div></div>
<div class="section"><b>Opportunity Score Breakdown</b>${l.breakdown.map(x=>`<div class="kv"><span>${esc(x[0])}</span><span>+${x[1]}</span></div>`).join('')}</div>
<div class="section"><b>CRM</b><div class="grid2"><label class="field"><span>Stage</span><select id="stage">${STAGES.map(x=>`<option ${x===(s.stage||'New')?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Follow-up date</span><input id="follow" type="date" value="${esc(s.followUp||'')}"></label></div><label class="field" style="display:block;margin-top:10px"><span>Notes</span><textarea id="notes" rows="5">${esc(s.notes||'')}</textarea></label><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" onclick="saveDrawer()">Save CRM Details</button><button class="btn" onclick="deepScan(state.selected)">Deep Scan</button>${findSaved(l)?`<button class="btn danger" onclick="removeLead(state.selected)">Remove</button>`:''}</div></div>
<div class="section"><b>Activity History</b>${acts.length?acts.map(a=>`<div class="kv"><span>${new Date(a.date).toLocaleString()}</span><span>${esc(a.text)}</span></div>`).join(''):'<div class="sub">No activity yet.</div>'}</div></div></div>`}
function searchView(){let v=visible(),hot=v.filter(x=>x.temp==='HOT').length,avg=v.length?Math.round(v.reduce((a,b)=>a+b.score,0)/v.length):0,dm=v.filter(x=>x.decisionMaker).length,weak=v.filter(x=>!x.website||x.webScore<60).length;return`<div class="panel searchbox"><label class="field"><span>Niche</span><input value="${esc(state.form.niche)}" oninput="state.form.niche=this.value"></label><label class="field"><span>Business name</span><input value="${esc(state.form.businessName)}" oninput="state.form.businessName=this.value"></label><label class="field"><span>City / multiple cities</span><input value="${esc(state.form.cities)}" oninput="state.form.cities=this.value"></label><label class="field"><span>State</span><input value="${esc(state.form.state)}" oninput="state.form.state=this.value"></label><label class="field"><span>Area / county</span><input value="${esc(state.form.area)}" oninput="state.form.area=this.value"></label><label class="field"><span>Maps keyword</span><input value="${esc(state.form.keyword)}" oninput="state.form.keyword=this.value"></label><label class="field"><span>Max leads</span><select onchange="state.form.limit=+this.value"><option>10</option><option selected>20</option><option>40</option><option>60</option></select></label><button class="btn primary" onclick="generate()">Scan Market</button></div><div class="stats"><div class="stat"><span>Visible Leads</span><b>${v.length}</b></div><div class="stat"><span>HOT Opportunities</span><b class="hot">${hot}</b></div><div class="stat"><span>Avg Opportunity</span><b>${avg}/100</b></div><div class="stat"><span>Decision Makers</span><b>${dm}</b></div><div class="stat"><span>Weak / No Website</span><b>${weak}</b></div></div><div class="panel"><div class="head"><div><div class="eyebrow">MARKET RESULTS</div><h2>Prospects</h2></div><div><button class="btn" onclick="bulkScan()">Deep Scan Top 10</button> <button class="btn" onclick="bulkSave()">Bulk Save</button></div></div>${filterHtml()}${table(v)}</div>`}
function pipelineView(){let counts=Object.fromEntries(STAGES.map(s=>[s,state.saved.filter(l=>(l.stage||'New')===s).length]));return`<div class="panel" style="padding:14px;margin-bottom:14px"><div class="eyebrow">PERSISTENT DEMO CRM</div><h2 style="margin:5px 0">Sales Pipeline</h2><p class="sub">Stored in this browser using localStorage. Refreshing the page keeps your demo CRM.</p></div><div class="pipeline">${STAGES.map(s=>`<div class="col"><div class="colh"><b>${s}</b><span>${counts[s]}</span></div>${state.saved.filter(l=>(l.stage||'New')===s).map(l=>`<div class="card" onclick="openLead('${l.id}')"><b>${esc(l.name)}</b><div class="sub">${esc(l.city)}, ${esc(l.state)} · ${l.score}/100 ${l.temp}</div><select onclick="event.stopPropagation()" onchange="setStage(state.saved.find(x=>x.id==='${l.id}'),this.value)">${STAGES.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>`}
function historyView(){return`<div class="panel"><div class="head"><div><div class="eyebrow">SEARCH HISTORY</div><h2>Recent market scans</h2></div></div>${state.history.length?state.history.map(h=>`<div class="historyrow"><div>${new Date(h.date).toLocaleString()}</div><div><b>${esc(h.businessName||h.niche)}</b><div class="sub">${esc(h.area||'No area filter')}</div></div><div>${esc((h.cities||[]).join(', '))} ${esc(h.state)}</div><div>${esc(h.keyword||h.niche)}</div><div>${h.resultCount}</div></div>`).join(''):'<div class="empty">No search history yet.</div>'}</div>`}
function render(){const title=state.view==='search'?'Find businesses that need better marketing.':state.view==='pipeline'?'Work every prospect from research to close.':'Reuse and audit your market searches.';document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>Lead Intelligence</b><span>Marketing Opportunity CRM</span></div><div class="nav"><button class="${state.view==='search'?'active':''}" onclick="state.view='search';render()">⌕ Market Search</button><button class="${state.view==='pipeline'?'active':''}" onclick="state.view='pipeline';render()">▦ CRM Pipeline <b style="float:right">${state.saved.length}</b></button><button class="${state.view==='history'?'active':''}" onclick="state.view='history';render()">↻ Search History</button></div><div class="conn"><h4>DATA CONNECTIONS</h4><div class="prov"><span>Google Places</span><b>DEMO</b></div><div class="prov"><span>Hunter</span><b>DEMO</b></div><div class="prov"><span>DataForSEO</span><b>DEMO</b></div><div class="prov"><span>Social Activity</span><b>DEMO</b></div><div class="prov"><span>CRM Storage</span><b style="color:var(--green)">LOCAL</b></div></div></aside><main class="main"><div class="top"><div><div class="eyebrow">PRIVATE FUNCTIONAL PREVIEW</div><h1>${title}</h1><p>Interactive demo with persistent browser CRM. HOT means digital-marketing opportunity, not confirmed buying intent.</p></div><div><span class="pill">● DEMO MODE</span> <button class="btn" onclick="csv()">Export CRM CSV</button></div></div><div class="notice">This preview is fully interactive without paid APIs. Live Google Places, Hunter, DataForSEO and compliant social providers can be connected server-side after approval.</div>${state.view==='search'?searchView():state.view==='pipeline'?pipelineView():historyView()}</main>${drawer()}</div>`}
render();
</script></body></html>
