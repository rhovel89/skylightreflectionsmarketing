<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lead Intelligence CRM</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#eef3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#080b12;padding:24px;text-align:center}
#boot .box{max-width:680px;border:1px solid #253047;border-radius:16px;background:#0f1420;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#boot h1{font-size:22px;margin:0 0 8px}#boot p{margin:6px 0;color:#91a0ba;line-height:1.45}.cyan{color:#4dd8ff}.bad{color:#ff8f9f}.good{color:#75f3b3}
button{margin-top:12px;border:1px solid #31415f;border-radius:10px;padding:10px 14px;background:#1a2438;color:#fff;font-weight:800;cursor:pointer}
iframe{width:100%;height:100%;border:0;display:none;background:#080b12}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="cyan" style="font-size:11px;font-weight:800;letter-spacing:.15em">LEAD INTELLIGENCE CRM</div><h1>Loading the full production CRM…</h1><p id="bootStatus">Starting application…</p><div id="bootDetail"></div></div></div>
<iframe id="appFrame" src="/index.html?crm-base=1" title="Lead Intelligence CRM" allow="clipboard-write"></iframe>
<script>
(()=>{
 const BUILD='2026-08-23-manual-lead-editor-v1';
 const frame=document.getElementById('appFrame'),boot=document.getElementById('boot'),status=document.getElementById('bootStatus'),detail=document.getElementById('bootDetail');
 const coreScripts=['cloud.js','real-audit.js','real-search.js','full-enrich.js','priorities-settings.js','google-budget.js','source-import.js','low-hanging-fruit.js','free-mode.js','free-live-market.js','auto-free-enrich.js','best-prospects.js','free-decision-makers.js','quick-wins.js','security-auth.js','production-intelligence.js','lawyers-niche.js','phase15-core.js','phase15-health.js','phase15-ui.js','score-meanings.js','service-focus.js','prospect-service-filters.js','score-meanings-complete.js','prime-need-fix.js','prime-reachability-fix.js','results-visibility-fix.js','score-guide-seo-lab.js','hot-cold-verified-fix.js','gbp-status-seo-lab.js','sales-tools-tabs.js','sales-tools-polish.js','manual-lead-editor.js'];
 const supabaseSources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
 function loadScript(doc,src,timeout=15000){return new Promise((resolve,reject)=>{const s=doc.createElement('script');let done=false;const t=setTimeout(()=>{if(done)return;done=true;s.remove();reject(new Error('Timed out: '+src))},timeout);s.src=src;s.async=false;s.onload=()=>{if(done)return;done=true;clearTimeout(t);resolve(src)};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);reject(new Error('Failed to load: '+src))};doc.body.appendChild(s)})}
 async function loadFirst(doc,list){let last;for(const src of list){try{return await loadScript(doc,src,18000)}catch(e){last=e}}throw last||new Error('Supabase SDK failed to load')}
 function fail(message,failures=[]){status.innerHTML='<span class="bad"><b>CRM failed to load.</b></span>';detail.innerHTML='<p>'+String(message).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</p>'+(failures.length?'<p class="bad">Failed file(s): '+failures.join(', ')+'</p>':'')+'<button onclick="location.reload()">Retry Full CRM</button>';frame.style.display='none';boot.style.display='flex'}
 frame.addEventListener('load',async()=>{
   try{
     const doc=frame.contentDocument;if(!doc)throw new Error('Could not access the application frame.');
     status.textContent='Loading secure cloud connection…';
     await loadFirst(doc,supabaseSources);
     const failures=[];
     for(let i=0;i<coreScripts.length;i++){
       const file=coreScripts[i];status.textContent=`Loading CRM feature ${i+1} of ${coreScripts.length}: ${file}`;
       try{await loadScript(doc,'/'+file+'?v='+encodeURIComponent(BUILD),18000)}catch(e){failures.push(file);console.error(e)}
     }
     const critical=['cloud.js','low-hanging-fruit.js','free-live-market.js','production-intelligence.js','prime-need-fix.js','score-guide-seo-lab.js','hot-cold-verified-fix.js','sales-tools-tabs.js','manual-lead-editor.js'];
     const criticalFailed=failures.filter(x=>critical.includes(x));
     if(criticalFailed.length)throw new Error('One or more required CRM modules could not be loaded: '+criticalFailed.join(', '));
     status.innerHTML='<span class="good"><b>CRM loaded.</b></span>';
     frame.style.display='block';boot.style.display='none';
     if(failures.length){console.warn('Optional CRM modules failed:',failures);try{const note=doc.createElement('div');note.style='position:fixed;left:12px;bottom:12px;z-index:9999;background:#32141a;color:#ffb4be;border:1px solid #6e2532;padding:8px 10px;border-radius:8px;font:12px system-ui';note.textContent='Some optional CRM modules did not load: '+failures.join(', ');doc.body.appendChild(note)}catch{}}
   }catch(e){fail(e?.message||'Unknown loader error')}
 });
 frame.addEventListener('error',()=>fail('The base CRM document could not be loaded.'));
 setTimeout(()=>{if(frame.style.display!=='block'&&status.textContent.includes('Starting'))fail('The application did not begin loading. Please retry.')},20000);
})();
</script>
</body>
</html>
