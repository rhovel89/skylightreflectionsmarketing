<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lead Intelligence CRM</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#eef3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#080b12;padding:24px;text-align:center}
#boot .box{max-width:720px;border:1px solid #253047;border-radius:16px;background:#0f1420;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#boot h1{font-size:22px;margin:0 0 8px}#boot p{margin:6px 0;color:#91a0ba;line-height:1.45}.cyan{color:#4dd8ff}.bad{color:#ff8f9f}.good{color:#75f3b3}
button{margin-top:12px;border:1px solid #31415f;border-radius:10px;padding:10px 14px;background:#1a2438;color:#fff;font-weight:800;cursor:pointer}
iframe{width:100%;height:100%;border:0;display:none;background:#080b12}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="cyan" style="font-size:11px;font-weight:800;letter-spacing:.15em">LEAD INTELLIGENCE CRM</div><h1>Loading the full production CRM…</h1><p id="bootStatus">Loading pinned application build…</p><div id="bootDetail"></div></div></div>
<iframe id="appFrame" title="Lead Intelligence CRM" allow="clipboard-write"></iframe>
<script>
(()=>{
 const PIN='77627f76e0a799f92ba0b5abdccd0f7857110c83';
 const CDN=`https://rawcdn.githack.com/rhovel89/skylightreflectionsmarketing/${PIN}/`;
 const BASE=CDN+'index.html';
 const frame=document.getElementById('appFrame'),boot=document.getElementById('boot'),status=document.getElementById('bootStatus'),detail=document.getElementById('bootDetail');
 const coreScripts=['cloud.js','real-audit.js','real-search.js','full-enrich.js','priorities-settings.js','google-budget.js','source-import.js','low-hanging-fruit.js','free-mode.js','free-live-market.js','auto-free-enrich.js','best-prospects.js','free-decision-makers.js','quick-wins.js','security-auth.js','production-intelligence.js','lawyers-niche.js','phase15-core.js','phase15-health.js','phase15-ui.js','score-meanings.js','service-focus.js','prospect-service-filters.js','score-meanings-complete.js','prime-need-fix.js','prime-reachability-fix.js','results-visibility-fix.js','score-guide-seo-lab.js','hot-cold-verified-fix.js','gbp-status-seo-lab.js','sales-tools-tabs.js','sales-tools-polish.js','manual-lead-editor.js','funnel-intelligence.js','google-live-data.js','ai-sales-assistant-ui.js','provider-error-runtime-fix.js','growth-os-core.js','growth-os-ui.js'];
 const critical=['cloud.js','low-hanging-fruit.js','free-live-market.js','production-intelligence.js','prime-need-fix.js','score-guide-seo-lab.js','hot-cold-verified-fix.js','sales-tools-tabs.js','manual-lead-editor.js','funnel-intelligence.js'];
 const supabaseSources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
 let started=false,done=false;
 const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
 function fail(message,failures=[]){if(done)return;done=true;status.innerHTML='<span class="bad"><b>CRM failed to load.</b></span>';detail.innerHTML='<p>'+esc(message)+'</p>'+(failures.length?'<p class="bad">Failed file(s): '+failures.map(esc).join(', ')+'</p>':'')+'<button onclick="location.reload()">Retry Full CRM</button>';frame.style.display='none';boot.style.display='flex'}
 function loadScript(doc,src,timeout=20000){return new Promise((resolve,reject)=>{const s=doc.createElement('script');let settled=false;const t=setTimeout(()=>{if(settled)return;settled=true;s.remove();reject(new Error('Timed out: '+src))},timeout);s.src=src;s.async=false;s.onload=()=>{if(settled)return;settled=true;clearTimeout(t);resolve(src)};s.onerror=()=>{if(settled)return;settled=true;clearTimeout(t);reject(new Error('Failed to load: '+src))};doc.body.appendChild(s)})}
 async function loadFirst(doc,list){let last;for(const src of list){try{return await loadScript(doc,src,22000)}catch(e){last=e}}throw last||new Error('Supabase SDK failed to load')}
 async function fetchBase(){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),20000);try{const r=await fetch(BASE,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error(`Base CRM returned HTTP ${r.status}`);const text=await r.text();if(!text.includes('Lead Intelligence CRM')||!text.includes('id="app"'))throw new Error('Pinned base CRM was not valid HTML.');return text}finally{clearTimeout(timer)}}
 frame.addEventListener('load',async()=>{if(!started||done)return;try{const doc=frame.contentDocument;if(!doc)throw new Error('Could not access the application frame.');status.textContent='Loading secure cloud connection…';await loadFirst(doc,supabaseSources);const failures=[];for(let i=0;i<coreScripts.length;i++){const file=coreScripts[i];status.textContent=`Loading CRM feature ${i+1} of ${coreScripts.length}: ${file}`;try{await loadScript(doc,CDN+file,22000)}catch(e){failures.push(file);console.error(e)}}const requiredFailures=failures.filter(x=>critical.includes(x));if(requiredFailures.length)throw new Error('Required CRM modules failed: '+requiredFailures.join(', '));done=true;status.innerHTML='<span class="good"><b>CRM loaded.</b></span>';frame.style.display='block';boot.style.display='none';if(failures.length){console.warn('Optional CRM modules failed:',failures);try{const note=doc.createElement('div');note.style='position:fixed;left:12px;bottom:12px;z-index:9999;background:#32141a;color:#ffb4be;border:1px solid #6e2532;padding:8px 10px;border-radius:8px;font:12px system-ui';note.textContent='Some optional CRM modules did not load: '+failures.join(', ');doc.body.appendChild(note)}catch{}}}catch(e){fail(e?.message||'Unknown loader error')}});
 (async()=>{try{status.textContent='Loading pinned base CRM…';const html=await fetchBase();started=true;frame.srcdoc=html}catch(e){fail(e?.message||'Could not load pinned base CRM')}})();
 setTimeout(()=>{if(!done&&!started)fail('The pinned base CRM did not begin loading. Check your network connection and retry.')},30000);
})();
</script>
</body>
</html>
