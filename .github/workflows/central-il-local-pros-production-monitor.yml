name: Central Illinois Local Pros Production Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Central Illinois Local Pros Build
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: central-il-local-pros-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://central-il-local-pros.vercel.app
    steps:
      - name: Allow successful Git deployment to promote
        if: github.event_name == 'workflow_run'
        shell: bash
        run: sleep 60

      - name: Verify production health and database connectivity
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/api/health")"
          echo "$HEALTH" | jq -e '.ok == true' >/dev/null

      - name: Verify core public routes
        shell: bash
        run: |
          set -euo pipefail
          for ROUTE in / /illinois /guides /robots.txt /sitemap.xml /login /search /illinois/chatham; do
            echo "Checking $ROUTE"
            curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --output /tmp/response "$SITE_URL$ROUTE"
            test -s /tmp/response
          done

      - name: Verify dynamic market discovery and public brand
        shell: bash
        run: |
          set -euo pipefail
          HOME="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/")"
          printf '%s' "$HOME" | grep -q 'Find the Right Local Pro'
          printf '%s' "$HOME" | grep -q '>Chatham<'
          CHATHAM="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/illinois/chatham")"
          printf '%s' "$CHATHAM" | grep -q 'Chatham'

      - name: Verify crawler signals
        shell: bash
        run: |
          set -euo pipefail
          ROBOTS="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/robots.txt")"
          printf '%s' "$ROBOTS" | grep -qi 'Disallow: /admin'
          printf '%s' "$ROBOTS" | grep -qi 'Sitemap:'
          SITEMAP="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/sitemap.xml")"
          printf '%s' "$SITEMAP" | grep -q 'central-il-local-pros.vercel.app'
          if printf '%s' "$SITEMAP" | grep -q 'example.com'; then
            echo 'Production sitemap unexpectedly references example.com.' >&2
            exit 1
          fi

      - name: Verify private and dynamic-search crawler protection
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/admin" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'
          SEARCH="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/search?city=chatham")"
          printf '%s' "$SEARCH" | grep -qi 'noindex'
