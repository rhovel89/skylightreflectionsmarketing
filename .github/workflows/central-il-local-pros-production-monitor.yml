name: Central Illinois Local Pros Production Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-il-local-pros-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://central-il-local-pros.vercel.app
    steps:
      - name: Verify production health and database connectivity
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$SITE_URL/api/health")"
          echo "$HEALTH" | jq -e '.ok == true' >/dev/null

      - name: Verify core public routes
        shell: bash
        run: |
          set -euo pipefail
          for ROUTE in / /illinois /guides /robots.txt /sitemap.xml /login; do
            echo "Checking $ROUTE"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --output /tmp/response "$SITE_URL$ROUTE"
            test -s /tmp/response
          done

      - name: Verify public brand and crawler signals
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SITE_URL/" | grep -q 'Find the Right Local Pro'
          ROBOTS="$(curl --fail --silent --show-error "$SITE_URL/robots.txt")"
          printf '%s' "$ROBOTS" | grep -qi 'Disallow: /admin'
          printf '%s' "$ROBOTS" | grep -qi 'Sitemap:'
          SITEMAP="$(curl --fail --silent --show-error "$SITE_URL/sitemap.xml")"
          printf '%s' "$SITEMAP" | grep -q 'central-il-local-pros.vercel.app'
          if printf '%s' "$SITEMAP" | grep -q 'example.com'; then
            echo 'Production sitemap unexpectedly references example.com.' >&2
            exit 1
          fi

      - name: Verify private area crawler protection
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head "$SITE_URL/admin" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'
