name: Central Illinois Local Pros Build

on:
  push:
    branches:
      - central-il-local-pros-v15.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      requires_deployment: ${{ steps.deploy_scope.outputs.requires_deployment }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zbsdbqdvmlatlklwjiuh.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LBq2AdU6exdOApLzWspZxw_s8P22U1d
      NEXT_PUBLIC_SITE_URL: https://central-il-local-pros.vercel.app
    steps:
      - name: Checkout isolated Local Pros branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect whether this commit requires a Vercel deployment
        id: deploy_scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "requires_deployment=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${GITHUB_SHA}^" "$GITHUB_SHA" -- . ':(exclude).github/**'; then
            echo "requires_deployment=false" >> "$GITHUB_OUTPUT"
          else
            echo "requires_deployment=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Start production server and smoke test safe routes
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/local-pros-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/local-pros-next.log
            exit 1
          fi

          for ROUTE in / /illinois /guides /robots.txt /sitemap.xml /login; do
            echo "Smoke testing $ROUTE"
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000${ROUTE}"
          done

          curl --silent --show-error --head http://127.0.0.1:3000/admin | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'
          grep -q "robots:{index:false,follow:true}" app/search/page.tsx
      - name: Package validated deploy source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cilp-deploy
          rsync -a ./ /tmp/cilp-deploy/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.next' \
            --exclude 'node_modules' \
            --exclude '.env*' \
            --exclude 'CANONICAL_STATUS.json' \
            --exclude 'VALIDATION.md' \
            --exclude 'LAUNCH_RUNBOOK.md' \
            --exclude 'README.md'
      - name: Upload validated deploy source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: central-il-local-pros-v15-5-deploy-source
          path: /tmp/cilp-deploy
          if-no-files-found: error
          retention-days: 1

  live-production:
    name: Verify exact production deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://central-il-local-pros.vercel.app
      REQUIRES_DEPLOYMENT: ${{ needs.validate.outputs.requires_deployment }}
    steps:
      - name: Verify canonical alias deployment state
        shell: bash
        run: |
          set -euo pipefail
          MATCHED=0
          for i in {1..48}; do
            HEALTH="$(curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors "$SITE_URL/api/health" || true)"
            LIVE_SHA="$(jq -r '.deployment_commit // empty' <<<"$HEALTH" 2>/dev/null || true)"
            OK="$(jq -r '.ok // false' <<<"$HEALTH" 2>/dev/null || true)"
            if [ "$REQUIRES_DEPLOYMENT" = "true" ]; then
              echo "Attempt $i: live commit=${LIVE_SHA:-unknown} expected=$GITHUB_SHA ok=$OK"
              if [ "$OK" = "true" ] && [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
                MATCHED=1
                break
              fi
            else
              echo "Attempt $i: workflow-only commit; live application commit=${LIVE_SHA:-unknown} ok=$OK"
              if [ "$OK" = "true" ] && [ -n "$LIVE_SHA" ]; then
                MATCHED=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$MATCHED" -ne 1 ]; then
            if [ "$REQUIRES_DEPLOYMENT" = "true" ]; then
              echo "Canonical production alias never reported the expected Git commit." >&2
            else
              echo "Canonical production alias did not report a healthy deployed application commit." >&2
            fi
            exit 1
          fi

      - name: Verify live dynamic-market discovery
        shell: bash
        run: |
          set -euo pipefail
          HOME="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$SITE_URL/")"
          grep -q 'Find the Right Local Pro' <<<"$HOME"
          grep -q '>Chatham<' <<<"$HOME"
          CHATHAM="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "$SITE_URL/illinois/chatham")"
          grep -q 'Chatham' <<<"$CHATHAM"

      - name: Verify live crawler and privacy controls
        shell: bash
        run: |
          set -euo pipefail
          ROBOTS="$(curl --fail --silent --show-error "$SITE_URL/robots.txt")"
          grep -qi 'Disallow: /admin' <<<"$ROBOTS"
          grep -qi 'Sitemap:' <<<"$ROBOTS"
          SITEMAP="$(curl --fail --silent --show-error "$SITE_URL/sitemap.xml")"
          grep -q 'central-il-local-pros.vercel.app' <<<"$SITEMAP"
          if grep -q 'example.com' <<<"$SITEMAP"; then
            echo 'Sitemap contains placeholder example.com URL.' >&2
            exit 1
          fi
          curl --silent --show-error --head "$SITE_URL/admin" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'
          SEARCH="$(curl --fail --silent --show-error "$SITE_URL/search?city=chatham")"
          grep -qi 'noindex' <<<"$SEARCH"
